 S.loud.forEach((g,i)=>{const at=[T[1]+.3,T[3]+.2,T[3]+.9,T[3]+1.6,T[3]+2.3][i];const shrink=eIO(P(t,T[9]+.4,T[9]+1.6));
   const k=eBack(P(t,at,at+.35))*(1-eIO(P(t,T[4]-.2,T[4]+.3)))+(sw(T[9],T[10])?(1-shrink):0);
   g.setAttribute("opacity",clamp(k).toFixed(3));const pulse=1+.05*Math.sin(t*9+i);g.setAttribute("transform",`translate(${g.x+Math.sin(t*14+i)*3},${g.y}) scale(${(clamp(k)*pulse*(sw(T[9],T[10])?lerp(1,.3,shrink):1)).toFixed(3)})`);});
 if(sw(T[1],T[4])){o={x:540,y:GY,look:Math.sin(t*3)*.5,droop:.3,cover:sw(T[3],T[4])?eIO(P(t,T[3]+1.2,T[3]+1.8))*.8:0};}
 // whisper
 const wk=win(t,T[5]-.05,T[7]-.05,.4,.3);S.whisper.setAttribute("opacity",(wk*(.75+.25*Math.sin(t*2))).toFixed(3));S.whisper.setAttribute("transform",`translate(${S.whisper.x},${S.whisper.y}) scale(${(.85+.15*wk).toFixed(3)})`);
 if(sw(T[4],T[7])){o={x:420,y:GY,look:1,droop:-.1+.2*Math.sin(t*.8)};}

 if(fu>0){const m=t>=T[12]?eIO(P(t,T[12]+.3,T[12]+1.6)):0;S.future.draw({x:lerp(760,540,m),y:GY,col:C.gold,droop:-.3,raise:t>=T[12]?.8:0,raiseL:t>=T[12]?.8:0});S.future.g.setAttribute("opacity",(Math.min(1,fu)*(.7+.3*Math.sin(t*3))*(1-m*.7)).toFixed(3));S.future.g.setAttribute("stroke-dasharray","8 8");}

 const tug=Math.sin(t*2.2)*40;S.ropeR.setAttribute("d",`M${350+tug},990 Q250,1100 160,1180`);S.ropeG.setAttribute("d",`M${730+tug},990 Q830,1100 920,1180`);
 S.ropeR.setAttribute("opacity",ck);S.ropeG.setAttribute("opacity",ck);if(sw(T[7],T[8]))op=0;

},
