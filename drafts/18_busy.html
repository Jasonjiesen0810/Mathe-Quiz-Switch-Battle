<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Choose Hard</title></head>
<body>
<script>
/* Hellblade ab 0; Bass-Einsatz 10,64 s; Schlag 0,67 s */
const A=[0.15,2.63,4.13,8.98], B=[11.35,14.55,18.98,20.81,24.25,30.59,31.77,34.46];
const B0=10.64, BP=.67, TW=11.35;
window.VIDEO={DUR:37.5,seed:181,audio:"18_vo/mix.wav",
HEADS:[
 {a:-1,b:A[1]-.1,lines:[["BEING",{t:"BUSY",red:1},"IS","A"],["FORM","OF",{t:"LAZINESS.",red:1}]]},
 {a:A[1]-.05,b:A[2]-.1,lines:[["SOUNDS"],[{t:"CRAZY?",gold:1}]]},
 {a:A[2]-.05,b:A[3]-.1,lines:[["MESSAGES.","DESK."],["TO-DO","LIST."]]},
 {a:A[3]-.05,b:TW-.1,lines:[["END","OF","THE","DAY:"],[{t:"EXHAUSTED.",red:1}]]},
 {a:TW-.05,b:B[1]-.1,lines:[["YOU","NEVER","TOUCHED"],["THE",{t:"ONE",gold:1},{t:"THAT",gold:1},{t:"MATTERED.",gold:1}]]},
 {a:B[1]-.05,b:B[2]-.1,lines:[["BUSY","WORK","NEVER"],[{t:"SCARES",red:1},"YOU."]]},
 {a:B[2]-.05,b:B[3]-.1,lines:[["THE",{t:"IMPORTANT",gold:1}],["TASK","DOES."]]},
 {a:B[3]-.05,b:B[4]-.1,lines:[["YOU",{t:"HIDE",red:1},"IN"],["SMALL","TASKS."]]},
 {a:B[4]-.05,b:B[5]-.1,lines:[["THE",{t:"FIX:",gold:1}],["BEFORE","ANY","MESSAGE…"]]},
 {a:B[5]-.05,b:B[6]-.1,lines:[[{t:"JUST ONE.",mark:1}]]},
 {a:B[6]-.05,b:B[7]-.1,lines:[["BUSY","IS",{t:"EASY.",red:1}],["IMPORTANT","IS",{t:"HARD.",gold:1}]]},
 {a:B[7]-.05,b:37,lines:[[{t:"CHOOSE HARD.",mark:1}]]},
],
LABELS:[
 {a:B[1]+1.6,b:B[2]-.1,text:"It feels productive."},
 {a:B[3]+1.4,b:B[4]-.1,text:"…and call it hard work."},
 {a:B[4]+2,b:B[5]-.1,text:"Do the one thing you've been avoiding."},
],
build(K){const {el,txt,C,scene,makeFig,pill,GY,rnd}=K;const S=K.S={};
 S.spot=K.spot(820,1);S.rays=K.raysG(540,1000);S.fig=makeFig();
 // orbiting small task cards
 S.small=["EMAIL","CHAT","DESK","LIST","LIKE","FILES","EMAIL","CHAT"].map((l,i)=>{const g=el("g",{},scene);el("rect",{x:-62,y:-26,width:124,height:52,rx:12,fill:C.card,stroke:C.grey,"stroke-width":3},g);
   txt(g,-10,8,l,18,{fill:C.grey,"font-weight":700,"letter-spacing":"3"});const ck=el("path",{d:"M34,0 L42,8 L56,-8",fill:"none",stroke:C.white,"stroke-width":4,"stroke-linecap":"round",opacity:0},g);return{g,ck,ph:i/8*Math.PI*2};});
 S.counter=el("g",{opacity:0},scene);el("rect",{x:-150,y:-40,width:300,height:80,rx:20,fill:C.card,stroke:C.white,"stroke-width":4},S.counter);S.cT=txt(S.counter,0,14,"TASKS DONE: 0",26,{"font-weight":800,"letter-spacing":"3"});
 S.sweat=el("path",{d:"M0,-14 Q8,-2 8,5 A8,8 0 1,1 -8,5 Q-8,-2 0,-14 Z",fill:C.white,opacity:0},scene);
 // the big one
 S.big=el("g",{},scene);S.bigR=el("rect",{x:-140,y:-220,width:280,height:220,rx:22,fill:"rgba(245,184,61,.1)",stroke:C.gold,"stroke-width":6,filter:"url(#glowB)"},S.big);
 txt(S.big,0,-128,"THE ONE",36,{fill:C.gold,"font-weight":800,"letter-spacing":"5"});txt(S.big,0,-80,"THAT MATTERS",24,{fill:C.gold,"font-weight":700,"letter-spacing":"4"});
 S.web=el("g",{opacity:0},S.big);for(let k=0;k<5;k++)el("path",{d:`M140,-220 L${140-Math.cos(k*.35)*110},${-220+Math.sin(k*.35)*110}`,stroke:"#aaa","stroke-width":2},S.web);[40,75].forEach(r=>el("path",{d:`M${140-r},-220 A${r},${r} 0 0 0 ${140-Math.cos(1.4)*r},${-220+Math.sin(1.4)*r}`,fill:"none",stroke:"#aaa","stroke-width":2},S.web));
 S.dust=[...Array(14)].map(()=>({c:el("circle",{r:2+rnd()*2,fill:"#bbb",opacity:0},scene),x:rnd()*260-130,y:-rnd()*240,s:.3+rnd()*.5}));
 // hiding wall
 S.wall=[...Array(9)].map((_,i)=>{const g=el("g",{opacity:0},scene);el("rect",{x:-66,y:-28,width:132,height:56,rx:10,fill:C.card,stroke:C.grey,"stroke-width":3},g);return{g,x:300+(i%3)*136,y:GY-30-Math.floor(i/3)*60};});
 // phone with messages crossed
 S.phone=el("g",{opacity:0},scene);el("rect",{x:-80,y:-140,width:160,height:280,rx:24,fill:C.card,stroke:C.white,"stroke-width":5},S.phone);
 [0,1,2].forEach(i=>el("rect",{x:-60,y:-100+i*60,width:120,height:44,rx:10,fill:"#222"},S.phone));
 S.phoneX=el("path",{d:"M-110,-170 L110,170 M110,-170 L-110,170",stroke:C.red,"stroke-width":12,"stroke-linecap":"round",opacity:0},S.phone);
 S.alarm=el("g",{opacity:0},scene);el("rect",{x:-110,y:-60,width:220,height:120,rx:18,fill:"#2b2016"},S.alarm);el("rect",{x:-90,y:-42,width:180,height:70,rx:8,fill:"#120606"},S.alarm);txt(S.alarm,0,10,"7:00",52,{fill:C.gold,"font-weight":800,"letter-spacing":"4"});
 // easy vs hard
 S.cmp=el("g",{opacity:0},scene);
 [["EASY",C.grey,270],["HARD",C.gold,810]].forEach(([l,col,x])=>{el("rect",{x:x-150,y:820,width:300,height:120,rx:24,fill:col===C.gold?"rgba(245,184,61,.1)":C.card,stroke:col,"stroke-width":5,filter:col===C.gold?"url(#glowB)":""},S.cmp);txt(S.cmp,x,898,l,52,{fill:col,"font-weight":800,"letter-spacing":"8"});});
},
render(t,K){const {P,eIO,eOut,eExpo,eBack,lerp,clamp,win,C,GY,S,grid,camFX}={...K,S:K.S};const sw=(a,b)=>t>=a&&t<b;
 const beat=(a,b,d=9,e=1)=>grid(t,B0,BP,a,b,d,e);
 let o={x:380,y:GY},op=1;
 // orbit (0-11)
 const orb=win(t,-1,TW-.05,.01,.2);const sp=t<A[1]?3.2:t<A[3]?2.4:.6;
 S.small.forEach((s,i)=>{const a=s.ph+t*sp;const rx=230,ry=120;const x=380+Math.cos(a)*rx,y=1180+Math.sin(a)*ry;
   const k=t<A[3]?1:lerp(1,0,eIO(P(t,A[3],TW)));s.g.setAttribute("opacity",(orb*(.5+.5*k)).toFixed(3));
   s.g.setAttribute("transform",`translate(${lerp(x,320+(i%4)*60,1-k)},${lerp(y,GY-20,1-k)}) rotate(${(1-k)*(i*13-40)})`);
   s.ck.setAttribute("opacity",t>A[2]+i*.5?1:0);});
 const cn=win(t,A[2],TW-.05,.2,.2);S.counter.setAttribute("opacity",cn.toFixed(3));S.counter.setAttribute("transform","translate(380,820)");
 S.cT.textContent="TASKS DONE: "+Math.floor(clamp((t-A[2])/(A[3]-A[2]))*47+(t>A[3]?Math.min(10,(t-A[3])*4):0));
 if(t<A[1])o={x:380,y:GY,raise:.5+.4*Math.sin(t*12),raiseL:.5-.4*Math.sin(t*12),look:Math.sin(t*6)};
 if(sw(A[1],A[2]))o={x:380,y:GY,look:-.3,droop:-.2};
 if(sw(A[2],A[3]))o={x:380,y:GY,raise:.5+.4*Math.sin(t*14),raiseL:.5-.4*Math.sin(t*14),look:Math.sin(t*7)*.7,droop:.1};
 if(sw(A[3],TW)){const k=eIO(P(t,A[3],A[3]+1.2));o={x:380,y:GY,sit:k,droop:.3+.8*k};}
 const sd=P(t,A[2]+1.5,A[2]+2.5);S.sweat.setAttribute("opacity",(sd>0&&sd<1?Math.sin(sd*Math.PI):0).toFixed(3));
 if(sd>0&&sd<1)S.sweat.setAttribute("transform",`translate(${+S.fig.head.getAttribute("cx")+44},${+S.fig.head.getAttribute("cy")-16+sd*24})`);
 // big task
 const loom=eIO(P(t,B[2],B[2]+.8))*(1-eIO(P(t,B[3]+2.5,B[3]+3.2)));
 const bigOn=Math.max(win(t,-1,B[6]-.05,.01,.3),win(t,B[7]-.05,37.5,.2,.6));
 S.big.setAttribute("opacity",(bigOn).toFixed(3));
 const grab=t>=B[4]+3?eIO(P(t,B[4]+3,B[4]+4.5)):0;
 S.big.setAttribute("transform",`translate(${t>=B[7]?560:lerp(820,560,grab)},${t>=B[7]?GY-330-Math.abs(Math.sin(t*3))*8:lerp(GY,GY-330,grab)}) scale(${(t<TW?.55:1)+.5*loom})`);
 S.bigR.setAttribute("stroke",loom>.3?C.red:C.gold);
 S.spot.setAttribute("opacity",(eIO(P(t,TW,TW+.3))*(1-eIO(P(t,B[7]+.5,B[7]+1)))*.9+(t<TW?.25:0)).toFixed(3));
 S.web.setAttribute("opacity",(t<B[4]+3?1:0)*eOut(P(t,TW,TW+.6)));
 S.dust.forEach(d=>{const k=((t*d.s)%1);d.c.setAttribute("cx",820+d.x);d.c.setAttribute("cy",GY-110+d.y-k*30);d.c.setAttribute("opacity",(sw(TW,B[1])?Math.sin(k*Math.PI)*.8:0).toFixed(3));});
 if(sw(TW,B[1]))o={x:300,y:GY,look:1,droop:.2,sit:1-eIO(P(t,TW,TW+.6))};
 if(sw(B[1],B[2]))o={x:300,y:GY,look:-.6,droop:-.1,raise:.3};
 if(sw(B[2],B[3])){const st=eIO(P(t,B[2]+.2,B[2]+.8));o={x:lerp(300,200,st),y:GY,droop:-.5*st,look:1,cover:.0,raise:.6*st,raiseL:.6*st};}
 // hiding wall
 S.wall.forEach((w,i)=>{const k=eBack(P(t,B[3]+i*.12,B[3]+.3+i*.12))*(1-eIO(P(t,B[4]+.1,B[4]+.5)));w.g.setAttribute("opacity",clamp(k).toFixed(3));w.g.setAttribute("transform",`translate(${w.x},${w.y-(1-clamp(k))*80})`);});
 if(sw(B[3],B[4])){const peek=Math.max(0,Math.sin((t-B[3])*2));o={x:400,y:GY,sit:.6,droop:.4-peek*.6,look:peek};}
 // fix
 const ph=win(t,B[4]-.05,B[4]+3,.2,.3);S.phone.setAttribute("opacity",ph.toFixed(3));S.phone.setAttribute("transform",`translate(250,1050) rotate(-8)`);S.phoneX.setAttribute("opacity",t>B[4]+1.2?1:0);
 const al=win(t,B[4]+.2,B[4]+3,.2,.3);S.alarm.setAttribute("opacity",al.toFixed(3));S.alarm.setAttribute("transform",`translate(560,${880+Math.sin(t*50)*3})`);
 if(sw(B[4],B[6])){const w=eIO(P(t,B[4]+2.8,B[4]+4.2));o={x:lerp(380,560,w),y:GY,ph:w*8,droop:-.2,raise:t>B[4]+4?.9:0,raiseL:t>B[4]+4?.9:0};}
 const cm=win(t,B[6]-.05,B[7]-.1,.2,.2);S.cmp.setAttribute("opacity",cm.toFixed(3));if(sw(B[6],B[7]))op=0;
 if(t>=B[7]){o={x:560,y:GY,raise:1.15,raiseL:1.15,droop:-.3,col:K.mixHex(C.white,C.gold,eIO(P(t,B[7],B[7]+.6)))};}
 S.fig.draw(o);S.fig.g.setAttribute("opacity",(op*K.endFade).toFixed(3));
 S.rays.setAttribute("opacity",(win(t,B[7],37.5,.1,.6)*(.4+.6*beat(B[7],37.5,7))).toFixed(3));S.rays.setAttribute("transform",`translate(560,${GY-300}) rotate(${t*9})`);
 // ===== camera: lots of movement
 const c=K.cam;
 camFX.dolly(t,c,0,A[1],{sc:1.12,cx:400,cy:1150});
 if(sw(A[1],A[2]))camFX.tilt(t,c,A[1],A[2],5);
 if(sw(A[2],A[3])){c.sc=1.08+.04*Math.sin(t*3);c.cx=420;c.rot+=Math.sin(t*8)*.8;}
 if(sw(A[3],TW))camFX.dolly(t,c,A[3],TW,{sc:1.2,cx:390,cy:1260});
 if(t>=TW&&t<B[1]){c.sc=1.3-.2*eOut(P(t,TW,TW+1.2));c.cx=lerp(390,780,eIO(P(t,TW,TW+.5)));c.cy=1250;}
 if(sw(B[1],B[2]))camFX.dolly(t,c,B[1],B[2],{sc:1.06,cx:500,cy:1200});
 if(sw(B[2],B[3])){camFX.dolly(t,c,B[2],B[2]+.6,{sc:1.18,cx:650,cy:1150});camFX.tilt(t,c,B[2],B[3],-6);}
 if(sw(B[3],B[4]))camFX.dolly(t,c,B[3],B[4],{sc:1.15,cx:430,cy:1300});
 if(sw(B[4],B[6]))camFX.dolly(t,c,B[4],B[6],{sc:1.08,cx:450,cy:1100});
 if(t>=B[7])camFX.dolly(t,c,B[7],37,{sc:1.14,cx:560,cy:1050});
 camFX.punch(t,c,window.VIDEO.HEADS.map(h=>h.a).filter(a=>a>0),.05,7);
 camFX.punch(t,c,[TW,B[7]],.14,5);c.sc+=beat(TW,B[1],9)*.03+beat(B[7],37.5,8)*.06+beat(A[2],A[3]+.01,10)*0;
 camFX.shake(t,c,[TW,B[2]+.2,B[7]],18,6);camFX.shake(t,c,[B[3]+.4,B[4]+1.2],9,8);
 camFX.whip(t,c,B[4],1);camFX.whip(t,c,B[6],-1);
 K.flash+=(t>=TW?Math.exp(-(t-TW)*9)*.45:0)+K.pulses(t,[B[2]+.2,B[5],B[7]],10,.25,.3)+beat(B[7],37,12,2)*.1;
 K.dim=win(t,A[3]+.5,TW,.4,.05)*.55;
},
};
</script>
<script src="lib/core.js"></script>
</body></html>
