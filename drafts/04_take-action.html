<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take Action</title>
<style>
@font-face{font-family:"Outfit";src:url("../materials/fonts/Outfit-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
:root{--bg:#070707;--white:#F5F5F7;--grey:#8E8E93;--gold:#F5B83D;--red:#FF453A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:"Outfit",system-ui,sans-serif}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1080px;height:1920px;background:var(--bg);overflow:hidden;transform-origin:center center;flex:none}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 45% at 50% 52%,#161616 0%,#0c0c0c 45%,#070707 75%)}
svg{position:absolute;inset:0}
.hl{position:absolute;left:70px;width:880px;text-align:center;color:var(--white);font-weight:800;font-size:84px;line-height:1.06;letter-spacing:-.5px;text-shadow:0 0 28px rgba(255,255,255,.18)}
.hl .ln{display:block;white-space:nowrap}
.hl .w{display:inline-block;margin:0 .13em;will-change:transform,opacity,filter}
.hl .gold{color:var(--gold);text-shadow:0 0 32px rgba(245,184,61,.45)}
.hl .red{color:var(--red);text-shadow:0 0 32px rgba(255,69,58,.4)}
.hl .mark{position:relative;padding:0 .16em}
.hl .mark i{position:absolute;left:0;top:.08em;bottom:.02em;width:100%;background:var(--gold);border-radius:.12em;transform-origin:left center;z-index:-1;box-shadow:0 0 40px rgba(245,184,61,.45)}
.hl .mark span{position:relative}
.label{position:absolute;left:70px;width:880px;text-align:center;color:var(--grey);font-weight:600;font-size:30px;letter-spacing:.32em;text-transform:uppercase}
#safe{position:absolute;inset:0;pointer-events:none;display:none}
#safe div{position:absolute;background:rgba(255,69,58,.18);border:2px dashed rgba(255,69,58,.6)}
#ui{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(30,30,32,.85);backdrop-filter:blur(12px);padding:8px 12px;border-radius:999px;color:#ddd;font:500 14px system-ui;z-index:9}
#ui button{background:#3a3a3c;color:#fff;border:0;border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer}
#ui input{width:200px}
body.export #ui{display:none}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="bg"></div>
  <svg id="g" viewBox="0 0 1080 1920" width="1080" height="1920">
    <defs>
      <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glowB" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glowGold" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glowGoldU" filterUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <radialGradient id="halo"><stop offset="0" stop-color="#F5B83D" stop-opacity=".38"/><stop offset="1" stop-color="#F5B83D" stop-opacity="0"/></radialGradient>
    </defs>
    <g id="stars"></g>
    <g id="scene"></g>
  </svg>
  <div id="heads"></div>
  <div id="safe"><div style="left:0;top:0;right:0;height:230px"></div><div style="left:0;bottom:0;right:0;height:384px"></div><div style="right:0;top:230px;bottom:384px;width:130px"></div></div>
</div></div>
<div id="ui"><button id="play">Play ▶</button><button id="restart">↺</button><input id="scrub" type="range" min="0" max="39" step="0.01" value="0"><span id="time">0.00 s</span><button id="safeBtn">Safe Zone</button></div>
<audio id="vo" src="04_vo/voiceover.wav" preload="auto"></audio>
<script>
/* ===== Timing: Höhepunkt (Musik-Einschlag) immer bei s6 = 34.6 s ===== */
const S={s1:0, s2:7.6, s3:12.6, s4:22.0, s5:27.8, s6:34.6};
const DUR=39;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,x)=>a+(b-a)*x;
const NS="http://www.w3.org/2000/svg";
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;};
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const C={white:"#F5F5F7",grey:"#8E8E93",dim:"#48484A",gold:"#F5B83D",red:"#FF453A"};
const txt=(parent,x,y,str,size,attrs={})=>{const e=el("text",Object.assign({x,y,"text-anchor":"middle",fill:C.white,"font-family":"Outfit","font-weight":600,"font-size":size,"letter-spacing":size*.24},attrs),parent);e.textContent=str;return e;};
const mixHex=(a,b,x)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return"#"+A.map((v,i)=>Math.round(lerp(v,B[i],x)).toString(16).padStart(2,"0")).join("");};

/* ===== Headlines ===== */
const HEADS=[
  {a:S.s1+.25,b:S.s2-.5, top:300, lines:[["PERFECT","PLAN."],[{t:"ZERO",red:1},{t:"STEPS.",red:1}]]},
  {a:S.s2+.15,b:S.s3-.5, top:330, lines:[["STILL","PLANNING?"]]},
  {a:S.s3+.15,b:S.s4-.5, top:300, lines:[["ACTION",{t:"BEATS",gold:1}],["PERFECTION."]]},
  {a:S.s4+.15,b:S.s5-.5, top:300, lines:[["EXECUTION","IS"],[{t:"EVERYTHING.",gold:1}]]},
  {a:S.s5+.15,b:S.s6-.5, top:300, lines:[["DO","SOMETHING."],["DO",{t:"ANYTHING.",gold:1}]]},
  {a:S.s6+.15,b:DUR-.6, top:330, lines:[[{t:"TAKE ACTION.",mark:1}]]},
];
const LABELS=[
  {a:S.s2+1.0,b:S.s2+2.1, top:460, text:"Week 1"},
  {a:S.s2+2.1,b:S.s2+3.2, top:460, text:"Week 2"},
  {a:S.s2+3.2,b:S.s2+4.3, top:460, text:"Week 3"},
  {a:S.s2+4.3,b:S.s3-.5, top:460, text:"Week 4"},
  {a:S.s3+1.0,b:S.s4-.5, top:520, text:"— Brian Tracy, Eat That Frog!"},
  {a:S.s6+1.4,b:DUR-.6, top:470, text:"Today."},
];
const heads=document.getElementById("heads");
HEADS.forEach(h=>{
  const d=document.createElement("div");d.className="hl";d.style.top=h.top+"px";h.words=[];
  h.lines.forEach(line=>{const ln=document.createElement("span");ln.className="ln";
    line.forEach(tok=>{const o=typeof tok==="string"?{t:tok}:tok;const w=document.createElement("span");w.className="w"+(o.gold?" gold":"")+(o.red?" red":"")+(o.mark?" mark":"");
      if(o.mark){w.innerHTML='<i></i><span>'+o.t+'</span>';w.bar=w.querySelector("i");w.txt=w.querySelector("span");}else w.textContent=o.t;
      ln.appendChild(w);h.words.push(w);});
    d.appendChild(ln);});
  heads.appendChild(d);h.el=d;});
LABELS.forEach(l=>{const d=document.createElement("div");d.className="label";d.style.top=l.top+"px";d.textContent=l.text;heads.appendChild(d);l.el=d;});
function wordStyle(w,t,start,end){
  const p=eExpo(P(t,start,start+.9)), q=eIO(P(t,end,end+.45));
  w.style.opacity=(p*(1-q)).toFixed(3);
  w.style.transform=`translateY(${(1-p)*46-q*24}px)`;
  w.style.filter=`blur(${((1-p)*14+q*10).toFixed(2)}px)`;
}

/* ===== Stars ===== */
const stars=document.getElementById("stars");const STARS=[];
for(let i=0;i<70;i++){STARS.push({c:el("circle",{cx:rnd()*1080,cy:rnd()*1920,r:.8+rnd()*1.6,fill:"#fff"},stars),o:.08+rnd()*.25,ph:rnd()*6.28,sp:.4+rnd()*.8});}
const scene=document.getElementById("scene");

/* ===== Ground + stairs ===== */
const GY=1440;
const ground=el("line",{x1:540,y1:GY,x2:540,y2:GY,stroke:C.white,"stroke-width":5,"stroke-linecap":"round",filter:"url(#glow)"},scene);
const STX=660, SW=70, SH=70, NST=4;
let sd=`M${STX-30},${GY} L${STX},${GY}`;
for(let k=0;k<NST;k++){sd+=` L${STX+k*SW},${GY-(k+1)*SH} L${STX+(k+1)*SW+(k===NST-1?10:0)},${GY-(k+1)*SH}`;}
const stairs=el("path",{d:sd,fill:"none",stroke:C.white,"stroke-width":5,"stroke-linejoin":"round","stroke-linecap":"round",filter:"url(#glow)"},scene);
const stairsLen=stairs.getTotalLength();stairs.style.strokeDasharray=stairsLen;
const STEPS=[];for(let k=0;k<NST;k++){const y=GY-(k+1)*SH,x1=STX+k*SW,x2=STX+(k+1)*SW+(k===NST-1?10:0);
  STEPS.push({x:(x1+x2)/2,y,seg:el("line",{x1,y1:y,x2,y2:y,stroke:C.gold,"stroke-width":7,"stroke-linecap":"round",filter:"url(#glowGoldU)",opacity:0},scene)});}
const topHalo=el("circle",{cx:STEPS[NST-1].x,cy:STEPS[NST-1].y-170,r:230,fill:"url(#halo)",opacity:0},scene);

/* ===== The (too) perfect plan board ===== */
const board=el("g",{},scene);
const BW=500,BH=520;
const bFrame=el("rect",{x:-BW/2,y:-BH/2,width:BW,height:BH,rx:30,fill:"#0d0d0d",stroke:C.white,"stroke-width":5},board);
const frameLen=2*(BW+BH);bFrame.style.strokeDasharray=frameLen;
const hdrLine=el("line",{x1:-BW/2,y1:-BH/2+66,x2:BW/2,y2:-BH/2+66,stroke:C.white,"stroke-width":4,opacity:.7},board);
const hdrT=txt(board,0,-BH/2+44,"THE PLAN",28,{"letter-spacing":"8"});
const NODES=[[-170,-150,"b"],[0,-160,"c"],[170,-140,"b"],[-90,-40,"c"],[90,-30,"b"],[-170,80,"b"],[20,70,"c"],[170,80,"b"],[-60,180,"c"],[170,190,"g"],
             [-205,5,"c"],[205,-80,"c"],[-140,215,"b"],[110,-95,"b"]];
const EDGES=[[0,1],[1,2],[0,3],[1,4],[2,4],[3,5],[3,6],[4,6],[4,7],[5,8],[6,8],[6,9],[7,9],[8,9],
             [10,2],[11,5],[12,1],[13,8],[10,7],[11,12]];
const edgeG=el("g",{},board), nodeG=el("g",{},board);
const EL=EDGES.map(([a,b],i)=>{const A=NODES[a],B=NODES[b];const l=el("line",{x1:A[0],y1:A[1],x2:B[0],y2:B[1],stroke:C.grey,"stroke-width":3,"stroke-linecap":"round"},edgeG);
  const L=Math.hypot(B[0]-A[0],B[1]-A[1]);l.style.strokeDasharray=L;return{l,L,extra:i>=14,i,fx:(rnd()-.5)*60,rot:(rnd()-.5)*40};});
const NL=NODES.map(([x,y,k],i)=>{const g=el("g",{},nodeG);let s;
  if(k==="b")s=el("rect",{x:-34,y:-22,width:68,height:44,rx:10,fill:"#0d0d0d",stroke:C.white,"stroke-width":4},g);
  else if(k==="c")s=el("circle",{r:24,fill:"#0d0d0d",stroke:C.white,"stroke-width":4},g);
  else s=el("path",{d:"M0,-30 L8,-9 L30,-9 L12,4 L19,26 L0,13 L-19,26 L-12,4 L-30,-9 L-8,-9 Z",fill:C.gold,stroke:C.gold,"stroke-width":3,"stroke-linejoin":"round",filter:"url(#glowGold)"},g);
  return{g,s,x,y,k,extra:i>=10,fx:(rnd()-.5)*80,rot:(rnd()-.5)*90,d:rnd()*.6};});

/* ===== Figures ===== */
function makeFig(){const g=el("g",{filter:"url(#glow)"},scene);const L={};
  ["legL","legR","armL","armR","body"].forEach(k=>L[k]=el("line",{stroke:C.white,"stroke-width":26,"stroke-linecap":"round"},g));
  const head=el("circle",{r:36,fill:C.white},g);
  const set=(l,a,b)=>{l.setAttribute("x1",a[0]);l.setAttribute("y1",a[1]);l.setAttribute("x2",b[0]);l.setAttribute("y2",b[1]);};
  return{g,draw(x,yF,ph,raise,droop,col){
    const hip=[x,yF-118], neck=[x+droop*8,yF-236+droop*6], sw=Math.sin(ph)*34;
    set(L.legL,hip,[x-24+sw,yF-13]);set(L.legR,hip,[x+24-sw,yF-13]);set(L.body,hip,neck);
    const sh=[neck[0],neck[1]+20];const aL=Math.PI/2+.38+sw*.008;
    set(L.armL,sh,[sh[0]+Math.cos(aL)*104,sh[1]+Math.sin(aL)*104]);
    const ang=lerp(Math.PI/2-.38-sw*.008,-Math.PI/5.2,raise);
    set(L.armR,sh,[sh[0]+Math.cos(ang)*110,sh[1]+Math.sin(ang)*110]);
    head.setAttribute("cx",neck[0]+droop*16);head.setAttribute("cy",neck[1]-50+droop*14);
    [L.legL,L.legR,L.armL,L.armR,L.body].forEach(l=>l.setAttribute("stroke",col));head.setAttribute("fill",col);}};}
const A=makeFig(), B=makeFig();

/* ===== B's small simple plan ===== */
const mini=el("g",{},scene);
el("rect",{x:-85,y:-55,width:170,height:110,rx:16,fill:"#0d0d0d",stroke:C.white,"stroke-width":4},mini);
txt(mini,0,-25,"PLAN",20,{"letter-spacing":"5"});
el("line",{x1:-55,y1:5,x2:55,y2:5,stroke:C.white,"stroke-width":5,"stroke-linecap":"round"},mini);
el("line",{x1:-55,y1:30,x2:25,y2:30,stroke:C.white,"stroke-width":5,"stroke-linecap":"round"},mini);

/* ===== Pills ===== */
function pill(x,y,str,col,w){const g=el("g",{},scene);
  el("rect",{x:-w/2,y:-32,width:w,height:64,rx:32,fill:col===C.gold?"rgba(245,184,61,.08)":"rgba(255,69,58,.06)",stroke:col,"stroke-width":3.5},g);
  txt(g,0,10,str,26,{fill:col,"letter-spacing":"5"});g.x=x;g.y=y;return g;}
const pZero=pill(230,1515,"0 STEPS",C.red,220);
const pNothing=pill(260,1515,"NOTHING DONE",C.red,300);
const pDone=pill(800,1515,"DONE",C.gold,170);
function showPill(g,t,a,b){const p=eExpo(P(t,a,a+.7)),q=eIO(P(t,b,b+.4));g.setAttribute("opacity",(p*(1-q)).toFixed(3));g.setAttribute("transform",`translate(${g.x},${g.y+(1-p)*20}) scale(${.92+.08*p})`);}

/* ===== Render ===== */
function climb(t,starts,x0,y0){let x=x0,y=y0,ph=0,n=0;
  starts.forEach((st,k)=>{const q=P(t,st,st+.42);if(q>0){const fx=k?STEPS[k-1].x:x0,fy=k?STEPS[k-1].y:y0;x=lerp(fx,STEPS[k].x,eIO(q));y=lerp(fy,STEPS[k].y,eIO(q))-Math.sin(q*Math.PI)*30;ph=(k+q)*Math.PI;if(q>=1)n=k+1;}});
  return{x,y,ph,n};}
function seek(t){
  t=clamp(t,0,DUR);
  STARS.forEach(s=>s.c.setAttribute("opacity",(s.o*(.6+.4*Math.sin(t*s.sp+s.ph))).toFixed(3)));
  HEADS.forEach(h=>{h.words.forEach((w,i)=>{wordStyle(w,t,h.a+i*.075,h.b);
    if(w.bar){const m=eIO(P(t,h.a+.25,h.a+.85));w.bar.style.transform=`scaleX(${m})`;w.txt.style.color=m>.5?"#070707":"";w.style.textShadow=m>.5?"none":"";}});});
  LABELS.forEach(l=>{const p=eOut(P(t,l.a,l.a+.5)),q=P(t,l.b-.05,l.b+.3);l.el.style.opacity=(p*(1-q)).toFixed(3);l.el.style.transform=`translateY(${(1-p)*18-q*10}px)`;});
  const endFade=1-eIO(P(t,DUR-.6,DUR));

  // ground
  const gp=eIO(P(t,.2,1.0));
  ground.setAttribute("x1",540-430*gp);ground.setAttribute("x2",540+410*gp);
  ground.setAttribute("opacity",(gp>0?1:0)*endFade);

  // board: in, grow, grey out, shrink, crumble
  const bIn=eIO(P(t,.7,1.5));
  bFrame.style.strokeDashoffset=frameLen*(1-bIn);
  const shrink=eIO(P(t,S.s3+.1,S.s3+1.1));
  const bx=lerp(610,265,shrink), by=lerp(960,850,shrink), bs=lerp(1,.6,shrink);
  board.setAttribute("transform",`translate(${bx},${by}) scale(${bs})`);
  const grey=eIO(P(t,S.s2+.5,S.s3));
  const crumble=P(t,S.s4+.9,S.s4+3.2);
  const bOut=eIO(P(t,S.s5-.3,S.s5+.6));
  board.setAttribute("opacity",((bIn>0?1:0)*(1-bOut)).toFixed(3));
  bFrame.setAttribute("stroke",mixHex(C.white,C.dim,grey));hdrT.setAttribute("fill",mixHex(C.white,C.grey,grey));
  hdrLine.setAttribute("opacity",(bIn*.7*(1-crumble)).toFixed(3));
  NL.forEach((n,i)=>{const st=n.extra?S.s2+.6+(i-10)*.75:1.2+i*.38;const p=eExpo(P(t,st,st+.5));
    const c=P(t,S.s4+.9+n.d,S.s4+2.4+n.d);
    const dy=c*c*520, dx=n.fx*c, rot=n.rot*c;
    n.g.setAttribute("transform",`translate(${n.x+dx},${n.y+dy}) rotate(${rot}) scale(${.5+.5*p})`);
    n.g.setAttribute("opacity",(p*(1-c)).toFixed(3));
    if(n.k!=="g")n.s.setAttribute("stroke",mixHex(C.white,C.dim,grey));
    else n.s.setAttribute("opacity",lerp(1,.35,grey));});
  EL.forEach(e=>{const st=e.extra?S.s2+.9+(e.i-14)*.55:1.5+e.i*.25;const k=eIO(P(t,st,st+.5));
    e.l.style.strokeDashoffset=e.L*(1-k);
    const c=P(t,S.s4+.8,S.s4+2.0);
    e.l.setAttribute("opacity",(1-c).toFixed(3));
    e.l.setAttribute("stroke",mixHex(C.grey,C.dim,grey));});
  bFrame.setAttribute("opacity",(1-crumble*.85).toFixed(3));

  // Figure A: stands, droops, later walks to stairs and climbs on the beat
  const aIn=eExpo(P(t,.4,1.3));
  let ax=lerp(230,265,shrink), ay=GY, aph=0;
  const droop=eIO(P(t,S.s2+.8,S.s2+2.5))*(1-eIO(P(t,S.s5+.4,S.s5+1.0)));
  const walk=P(t,S.s5+1.0,S.s5+3.4);
  if(walk>0){ax=lerp(265,STX-50,eIO(walk));aph=walk*Math.PI*7*(walk<1?1:0);}
  const beat=.46, aSteps=[0,1,2,3].map(k=>S.s6+.15+k*beat);
  const ca=climb(t,aSteps,STX-50,GY); if(t>aSteps[0]){ax=ca.x;ay=ca.y;aph=ca.ph;}
  A.draw(ax,ay,aph,0,droop,C.white);
  A.g.setAttribute("opacity",(aIn*endFade).toFixed(3));
  A.g.setAttribute("transform",`translate(0,${(1-aIn)*40})`);

  // stairs
  const sp=eIO(P(t,S.s3+1.0,S.s3+2.0));
  stairs.style.strokeDashoffset=stairsLen*(1-sp);
  stairs.setAttribute("opacity",(sp>0?1:0)*endFade);

  // Figure B: simple plan, climbs during the quote, leaves before A starts
  const bFig=eExpo(P(t,S.s3+1.3,S.s3+2.1)), bLeave=eIO(P(t,S.s5+.2,S.s5+1.0));
  const bSteps=[0,1,2,3].map(k=>S.s3+3.0+k*.9);
  const cb=climb(t,bSteps,STX-60,GY);
  B.draw(cb.x,cb.y,cb.ph,0,0,C.white);
  B.g.setAttribute("opacity",(bFig*(1-bLeave)).toFixed(3));
  B.g.setAttribute("transform",`translate(0,${(1-bFig)*40-bLeave*30})`);
  const mIn=eExpo(P(t,S.s3+1.6,S.s3+2.3)), mOut=eIO(P(t,bSteps[0]-.2,bSteps[0]+.3));
  mini.setAttribute("opacity",(mIn*(1-mOut)).toFixed(3));
  mini.setAttribute("transform",`translate(${STX-60},${1080+(1-mIn)*20-mOut*30})`);

  // gold steps: B's steps (fade later), then A's steps on the beat
  STEPS.forEach((s,k)=>{const lb=P(t,bSteps[k]+.35,bSteps[k]+.6)*(1-eIO(P(t,S.s5+.2,S.s5+1.0)));
    const la=P(t,aSteps[k]+.35,aSteps[k]+.55);
    s.seg.setAttribute("opacity",(Math.max(lb,la)*endFade).toFixed(3));});
  const hb=P(t,bSteps[3]+.4,bSteps[3]+1.2)*(1-eIO(P(t,S.s5+.2,S.s5+1.0)));
  const ha=P(t,aSteps[3]+.4,aSteps[3]+1.0);
  topHalo.setAttribute("opacity",(Math.max(hb*(.8+.2*Math.sin(t*3)),ha)*endFade).toFixed(3));

  // pills
  showPill(pZero,t,S.s1+5.0,S.s3+.2);
  showPill(pNothing,t,S.s3+6.6,S.s5-.3);
  showPill(pDone,t,bSteps[3]+.5,S.s5-.3);
}

/* ===== Player ===== */
const stage=document.getElementById("stage"), vo=document.getElementById("vo");
const isExport=/export/.test(location.search);
if(isExport)document.body.classList.add("export");
function fit(){if(isExport){stage.style.transform="none";return;}const s=Math.min(innerWidth/1080,(innerHeight-60)/1920);stage.style.transform=`scale(${s})`;}
addEventListener("resize",fit);fit();
let playing=false,t0=performance.now(),cur=0;
const scrub=document.getElementById("scrub"),tl=document.getElementById("time"),pb=document.getElementById("play");
scrub.max=DUR;
function frame(now){if(playing){cur=(now-t0)/1000;if(cur>=DUR){cur=0;t0=now;vo.currentTime=0;}}seek(cur);scrub.value=cur;tl.textContent=cur.toFixed(2)+" s";requestAnimationFrame(frame);}
pb.onclick=()=>{playing=!playing;pb.textContent=playing?"Pause":"Play ▶";t0=performance.now()-cur*1000;if(playing){vo.currentTime=cur;vo.play().catch(()=>{});}else vo.pause();};
document.getElementById("restart").onclick=()=>{cur=0;t0=performance.now();vo.currentTime=0;};
scrub.oninput=()=>{cur=+scrub.value;t0=performance.now()-cur*1000;vo.currentTime=cur;};
document.getElementById("safeBtn").onclick=()=>{const s=document.getElementById("safe");s.style.display=s.style.display==="block"?"none":"block";};
window.seek=seek;window.DUR=DUR;
document.fonts.ready.then(()=>{window.READY=true;if(!isExport)requestAnimationFrame(frame);else seek(0);});
</script>
</body>
</html>
