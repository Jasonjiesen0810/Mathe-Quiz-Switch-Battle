<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker-Turnier</title>
<style>
  :root {
    --bg: #08060f;
    --bg-glow: #1a0e2e;
    --panel: #12101f;
    --panel-2: #181530;
    --pink-1: #ff2f92;
    --pink-2: #8a2be2;
    --blue-1: #2b8fff;
    --blue-2: #1a1f7a;
    --cyan: #3ee6ff;
    --text: #ffffff;
    --text-dim: #a6a3c2;
    --danger: #ff3b5c;
    --green: #2fe88f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,47,146,0.16) 0%, transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(43,143,255,0.18) 0%, transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .app { width: 100%; max-width: 720px; }
  h1 {
    text-align: center; font-size: 1.9rem; letter-spacing: 1px; margin-bottom: 4px;
    background: linear-gradient(90deg, var(--pink-1), var(--cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { text-align: center; color: var(--text-dim); margin-bottom: 32px; font-size: 0.95rem; }
  .screen { display: none; }
  .screen.active { display: block; }

  .menu-buttons { display: flex; flex-direction: column; gap: 16px; }
  .big-btn {
    border: none;
    color: var(--text);
    padding: 30px 20px;
    border-radius: 16px;
    font-size: 1.3rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .big-btn.pink { background: linear-gradient(135deg, var(--pink-1), var(--pink-2)); box-shadow: 0 8px 24px rgba(255,47,146,0.35); }
  .big-btn.blue { background: linear-gradient(135deg, var(--blue-1), var(--blue-2)); box-shadow: 0 8px 24px rgba(43,143,255,0.35); }
  .big-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
  .big-btn .emoji { font-size: 2rem; display: block; margin-bottom: 8px; }

  .card {
    background: linear-gradient(160deg, var(--panel-2), var(--panel));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }
  label { display: block; margin-bottom: 6px; color: var(--text-dim); font-size: 0.9rem; }
  textarea, input[type=number], input[type=text] {
    width: 100%;
    background: #0b0a18;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 1rem;
    font-family: inherit;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--cyan); }
  textarea { min-height: 160px; resize: vertical; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
  .row > div { flex: 1; min-width: 140px; }

  button.action {
    background: linear-gradient(135deg, var(--pink-1), var(--pink-2));
    color: var(--text);
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 16px;
    box-shadow: 0 4px 16px rgba(255,47,146,0.3);
  }
  button.action:hover { filter: brightness(1.1); }
  button.secondary {
    background: transparent;
    color: var(--cyan);
    border: 1px solid var(--cyan);
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 12px;
    margin-right: 10px;
  }
  button.secondary:hover { background: rgba(62,230,255,0.1); }

  .flights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-top: 20px; }
  .flight-card { border-radius: 12px; padding: 14px; color: var(--text); }
  .flight-card:nth-child(odd) { background: linear-gradient(155deg, var(--pink-1), var(--pink-2)); }
  .flight-card:nth-child(even) { background: linear-gradient(155deg, var(--blue-1), var(--blue-2)); }
  .flight-card h3 { margin: 0 0 10px; color: #fff; font-size: 1rem; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
  .flight-card ul { margin: 0; padding-left: 18px; }
  .flight-card li { margin-bottom: 4px; }

  .info-bar {
    display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
    background: linear-gradient(160deg, var(--panel-2), var(--panel));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 14px; margin-top: 20px;
  }
  .info-bar .stat { text-align: center; }
  .info-bar .stat .val { font-size: 1.5rem; font-weight: 800; }
  .info-bar .stat:nth-child(1) .val { color: var(--pink-1); }
  .info-bar .stat:nth-child(2) .val { color: var(--cyan); }
  .info-bar .stat:nth-child(3) .val { color: var(--blue-1); }
  .info-bar .stat .lbl { font-size: 0.8rem; color: var(--text-dim); }
  .note { font-size: 0.85rem; color: var(--text-dim); text-align: center; margin-top: 10px; }

  .player-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

  .timer-wrap { text-align: center; }
  .level-badge {
    display: inline-block; padding: 6px 18px; border-radius: 20px;
    background: linear-gradient(135deg, var(--pink-1), var(--pink-2));
    font-weight: 700; font-size: 0.95rem; letter-spacing: 0.5px; margin-bottom: 14px;
  }
  .timer-clock { font-size: 4rem; font-weight: 800; letter-spacing: 2px; margin: 10px 0; color: #fff; text-shadow: 0 0 24px rgba(62,230,255,0.5); }
  .timer-clock.warn { color: var(--danger); text-shadow: 0 0 24px rgba(255,59,92,0.6); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .blinds-display { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
  .blind-box {
    background: linear-gradient(150deg, var(--pink-1), var(--pink-2));
    border-radius: 14px; padding: 16px 30px;
    box-shadow: 0 8px 20px rgba(255,47,146,0.3);
  }
  .blind-box .val { font-size: 2.1rem; font-weight: 800; color: #fff; }
  .blind-box .lbl { font-size: 0.8rem; color: rgba(255,255,255,0.85); }
  .next-level {
    display: inline-block; margin-top: 6px; padding: 8px 20px; border-radius: 20px;
    background: linear-gradient(135deg, var(--blue-1), var(--blue-2));
    color: #fff; font-size: 0.9rem; font-weight: 600;
  }
  .finalists { margin-top: 24px; }
  .finalists ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .finalists li { background: linear-gradient(135deg, var(--panel-2), var(--panel)); border: 1px solid var(--cyan); color: var(--cyan); padding: 8px 16px; border-radius: 20px; font-weight: 600; }
  .timer-controls { margin-top: 24px; }
  .timer-controls button { margin: 0 6px; }
</style>
</head>
<body>
<div class="app">
  <h1>🃏 Poker-Turnier</h1>
  <p class="subtitle">19. Geburtstag</p>

  <!-- START -->
  <div id="screen-start" class="screen active">
    <div class="menu-buttons">
      <button class="big-btn pink" onclick="showScreen('flights')">
        <span class="emoji">🎲</span>
        Flights einteilen
      </button>
      <button class="big-btn blue" onclick="showScreen('finale')">
        <span class="emoji">🏆</span>
        Finale
      </button>
    </div>
  </div>

  <!-- FLIGHTS -->
  <div id="screen-flights" class="screen">
    <div class="card">
      <label for="names">Namen (ein Name pro Zeile, beliebig viele)</label>
      <textarea id="names" placeholder="Julian&#10;Greta&#10;Frida&#10;..."></textarea>
      <div class="row">
        <div>
          <label for="numFlights">Anzahl Flights</label>
          <input type="number" id="numFlights" min="1" value="2">
        </div>
      </div>
      <button class="action" onclick="einteilen()">Einteilen</button>
      <button class="secondary" onclick="showScreen('start')">Zurück</button>
    </div>

    <div id="flightsResult"></div>

    <div class="info-bar">
      <div class="stat"><div class="val">2.500</div><div class="lbl">Chips (Buy-in)</div></div>
      <div class="stat"><div class="val">25</div><div class="lbl">Small Blind</div></div>
      <div class="stat"><div class="val">50</div><div class="lbl">Big Blind</div></div>
    </div>
    <p class="note">Blinds steigen alle 15-20 Minuten (25/50 → 50/100 → 100/200 → 200/500). Top 3 pro Flight erreichen das Finale.</p>
  </div>

  <!-- FINALE -->
  <div id="screen-finale" class="screen">
    <div id="finale-setup" class="card">
      <label>Finalisten eintragen (max. 6)</label>
      <div class="player-inputs">
        <input type="text" class="finalist-input" placeholder="Spieler 1">
        <input type="text" class="finalist-input" placeholder="Spieler 2">
        <input type="text" class="finalist-input" placeholder="Spieler 3">
        <input type="text" class="finalist-input" placeholder="Spieler 4">
        <input type="text" class="finalist-input" placeholder="Spieler 5">
        <input type="text" class="finalist-input" placeholder="Spieler 6">
      </div>
      <button class="action" onclick="startFinale()">Turnier starten</button>
      <button class="secondary" onclick="showScreen('start')">Zurück</button>
    </div>

    <div id="finale-timer" class="card timer-wrap" style="display:none;">
      <div class="level-badge" id="levelBadge">LEVEL 1</div>
      <div class="blinds-display">
        <div class="blind-box"><div class="val" id="sbVal">100</div><div class="lbl">Small Blind</div></div>
        <div class="blind-box"><div class="val" id="bbVal">200</div><div class="lbl">Big Blind</div></div>
      </div>
      <div class="timer-clock" id="clock">15:00</div>
      <div class="next-level" id="nextLevel">Nächste Stufe: 150 / 300</div>

      <div class="timer-controls">
        <button class="action" id="startPauseBtn" onclick="toggleTimer()">Start</button>
        <button class="secondary" onclick="resetTimer()">Reset</button>
        <button class="secondary" onclick="showScreen('start')">Zurück</button>
      </div>

      <div class="finalists">
        <ul id="finalistsList"></ul>
      </div>
    </div>
  </div>
</div>

<script>
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}

// ---------- Flights einteilen ----------
function einteilen() {
  const raw = document.getElementById('names').value;
  const names = raw.split('\n').map(n => n.trim()).filter(n => n.length > 0);
  const numFlights = parseInt(document.getElementById('numFlights').value, 10);

  if (names.length === 0) { alert('Bitte mindestens einen Namen eingeben.'); return; }
  if (!numFlights || numFlights < 1) { alert('Bitte eine gültige Anzahl Flights eingeben.'); return; }

  // Fisher-Yates Shuffle
  const shuffled = [...names];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }

  const flights = Array.from({ length: numFlights }, () => []);
  shuffled.forEach((name, i) => flights[i % numFlights].push(name));

  const resultDiv = document.getElementById('flightsResult');
  resultDiv.innerHTML = '<div class="flights-grid">' +
    flights.map((players, i) => `
      <div class="flight-card">
        <h3>Flight ${i + 1} (${players.length})</h3>
        <ul>${players.map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul>
      </div>
    `).join('') +
    '</div>';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- Finale ----------
const LEVELS = [
  { sb: 100, bb: 200 },
  { sb: 150, bb: 300 },
  { sb: 200, bb: 400 },
  { sb: 300, bb: 600 },
  { sb: 400, bb: 800 },
  { sb: 500, bb: 1000 },
  { sb: 750, bb: 1500 },
  { sb: 1000, bb: 2000 },
  { sb: 1500, bb: 3000 },
  { sb: 2000, bb: 4000 },
];
const LEVEL_SECONDS = 15 * 60;

let currentLevel = 0;
let remaining = LEVEL_SECONDS;
let timerInterval = null;
let running = false;

function startFinale() {
  const inputs = document.querySelectorAll('.finalist-input');
  const finalists = Array.from(inputs).map(i => i.value.trim()).filter(v => v.length > 0);

  if (finalists.length === 0) { alert('Bitte mindestens einen Finalisten eintragen.'); return; }

  document.getElementById('finalistsList').innerHTML =
    finalists.map(f => `<li>${escapeHtml(f)}</li>`).join('');

  document.getElementById('finale-setup').style.display = 'none';
  document.getElementById('finale-timer').style.display = 'block';

  currentLevel = 0;
  remaining = LEVEL_SECONDS;
  updateBlindsDisplay();
  updateClock();
}

function updateBlindsDisplay() {
  const lvl = LEVELS[Math.min(currentLevel, LEVELS.length - 1)];
  document.getElementById('sbVal').textContent = lvl.sb;
  document.getElementById('bbVal').textContent = lvl.bb;
  document.getElementById('levelBadge').textContent = `LEVEL ${currentLevel + 1}`;

  const next = LEVELS[Math.min(currentLevel + 1, LEVELS.length - 1)];
  document.getElementById('nextLevel').textContent =
    currentLevel + 1 < LEVELS.length
      ? `Level ${currentLevel + 2}: ${next.sb} / ${next.bb}`
      : 'Letzte Stufe erreicht';
}

function updateClock() {
  const m = Math.floor(remaining / 60).toString().padStart(2, '0');
  const s = (remaining % 60).toString().padStart(2, '0');
  const clock = document.getElementById('clock');
  clock.textContent = `${m}:${s}`;
  clock.classList.toggle('warn', remaining <= 30);
}

function toggleTimer() {
  running = !running;
  const btn = document.getElementById('startPauseBtn');
  if (running) {
    btn.textContent = 'Pause';
    timerInterval = setInterval(tick, 1000);
  } else {
    btn.textContent = 'Start';
    clearInterval(timerInterval);
  }
}

function tick() {
  remaining--;
  if (remaining <= 0) {
    if (currentLevel < LEVELS.length - 1) {
      currentLevel++;
      remaining = LEVEL_SECONDS;
      beep();
    } else {
      remaining = 0;
      clearInterval(timerInterval);
      running = false;
      document.getElementById('startPauseBtn').textContent = 'Start';
    }
    updateBlindsDisplay();
  }
  updateClock();
}

function resetTimer() {
  clearInterval(timerInterval);
  running = false;
  currentLevel = 0;
  remaining = LEVEL_SECONDS;
  document.getElementById('startPauseBtn').textContent = 'Start';
  updateBlindsDisplay();
  updateClock();
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  } catch (e) { /* Audio nicht verfügbar, ignorieren */ }
}
</script>
</body>
</html>
