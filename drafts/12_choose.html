<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Same Hour</title></head>
<body>
<script>
/* Satzteile (12_vo/durations.json) – Song 1 (Ainsi Bas La Vida) Start 5,03 s → Highlight auf T[11] */
const T=[0.15,3.97,7.31,9.45,11.13,15.36,17.87,23.04,25.39,27.38,29.25,31.69,34.25];
const BEATS=[36.72,37.33,37.68,37.96,38.32,38.65,39.07,39.44,39.7,40.05,40.36,40.72,41.07,41.43,41.79,42.11].map(b=>+(b-5.03).toFixed(2));
window.VIDEO={DUR:38.5,seed:121,audio:"12_vo/mix.wav",
HEADS:[
 {a:-1,b:T[1]-.1,lines:[["AN",{t:"IMPORTANT",gold:1},"TASK"],["TAKES","THE","SAME","TIME"],["AS","A",{t:"USELESS",red:1},"ONE."]]},
 {a:T[1]-.05,b:T[2]-.1,lines:[["YOUR",{t:"DREAM",gold:1}],["OR","YOUR",{t:"DESK?",red:1}]]},
 {a:T[2]-.05,b:T[3]-.1,lines:[["SAME","HOUR."],["SAME","ENERGY."]]},
 {a:T[3]-.05,b:T[4]-.1,lines:[["SO","WHAT'S","THE"],[{t:"DIFFERENCE?",gold:1}]]},
 {a:T[4]-.05,b:T[5]-.1,lines:[["NO","PRIDE."],["NO",{t:"PROGRESS.",red:1}]]},
 {a:T[5]-.05,b:T[6]-.1,lines:[["THE","IMPORTANT","ONE"],[{t:"CHANGES WHO YOU ARE.",mark:1}]]},
 {a:T[6]-.05,b:T[7]-.1,lines:[["TIME","MANAGEMENT","IS"],[{t:"LIFE",gold:1},{t:"MANAGEMENT.",gold:1}]]},
 {a:T[7]-.05,b:T[8]-.1,lines:[["EVERY","HOUR,","YOU"],[{t:"CHOOSE",gold:1},"WHAT'S","NEXT."]]},
 {a:T[8]-.05,b:T[9]-.1,lines:[["YOU","ARE","ALWAYS"],[{t:"FREE",gold:1},"TO","CHOOSE."]]},
 {a:T[9]-.05,b:T[10]-.1,lines:[["MOST","PEOPLE","CHOOSE"],[{t:"EASY.",red:1}]]},
 {a:T[10]-.05,b:T[11]-.1,lines:[["EFFECTIVE","PEOPLE","CHOOSE"],["WHAT",{t:"MATTERS.",gold:1}]]},
 {a:T[11]-.05,b:T[12]-.1,lines:[["CHOOSE","LIKE","YOUR"],["LIFE",{t:"DEPENDS",gold:1},{t:"ON",gold:1},{t:"IT.",gold:1}]]},
 {a:T[12]-.05,b:38,lines:[[{t:"BECAUSE IT DOES.",mark:1}]]},
],
LABELS:[
 {a:T[4]+.2,b:T[5]-.1,text:"The useless task gives you nothing."},
 {a:T[6]+.4,b:T[7]-.1,text:"— Brian Tracy, Eat That Frog!"},
],
build(K){const {el,txt,C,scene,makeFig,pill,GY,rnd}=K;const S=K.S={};
 S.spotL=K.spot(300,1);S.spotR=K.spot(780);S.rays=K.raysG(540,1000);
 // hourglasses
 const hg=(x,lab,col)=>{const g=el("g",{},scene);const top=el("path",{fill:col},g),bot=el("path",{fill:col},g),stream=el("line",{x1:0,y1:-6,x2:0,y2:130,stroke:col,"stroke-width":4},g);
   el("path",{d:"M-90,-150 L90,-150 L90,-140 Q90,-60 10,-6 L10,6 Q90,60 90,140 L90,150 L-90,150 L-90,140 Q-90,60 -10,6 L-10,-6 Q-90,-60 -90,-140 Z",fill:"none",stroke:C.white,"stroke-width":6,"stroke-linejoin":"round",filter:"url(#glowB)"},g);
   el("rect",{x:-110,y:-168,width:220,height:18,rx:6,fill:C.white},g);el("rect",{x:-110,y:150,width:220,height:18,rx:6,fill:C.white},g);
   txt(g,0,230,lab,34,{fill:col,"font-weight":800,"letter-spacing":"6"});return{g,top,bot,stream,x};};
 S.h1=hg(300,"DREAM",C.gold);S.h2=hg(780,"DESK",C.grey);
 S.div=el("line",{x1:540,y1:760,x2:540,y2:1440,stroke:"#fff","stroke-width":3,"stroke-dasharray":"8 10",opacity:0},scene);
 // two figures + props
 S.fL=makeFig();S.fR=makeFig();
 S.laptop=el("g",{opacity:0},scene);el("rect",{x:150,y:1290,width:260,height:16,rx:8,fill:C.white},S.laptop);el("line",{x1:170,y1:1306,x2:170,y2:1440,stroke:C.white,"stroke-width":8},S.laptop);el("line",{x1:390,y1:1306,x2:390,y2:1440,stroke:C.white,"stroke-width":8},S.laptop);
 el("path",{d:"M260,1290 L290,1210 L390,1210 L375,1290 Z",fill:C.card,stroke:C.gold,"stroke-width":5},S.laptop);
 S.deskR=el("g",{opacity:0},scene);el("rect",{x:700,y:1290,width:260,height:16,rx:8,fill:C.grey},S.deskR);el("line",{x1:720,y1:1306,x2:720,y2:1440,stroke:C.grey,"stroke-width":8},S.deskR);el("line",{x1:940,y1:1306,x2:940,y2:1440,stroke:C.grey,"stroke-width":8},S.deskR);
 S.cloth=el("rect",{x:-30,y:-12,width:60,height:24,rx:8,fill:C.grey},S.deskR);
 S.sparkles=[0,1,2].map(i=>el("path",{d:"M0,-10 L3,-3 L10,0 L3,3 L0,10 L-3,3 L-10,0 L-3,-3 Z",fill:C.grey,opacity:0},scene));
 // energy bars
 const bar=(x,col)=>{const g=el("g",{opacity:0},scene);el("rect",{x:x-40,y:880,width:80,height:220,rx:14,fill:C.card,stroke:col,"stroke-width":4},g);el("rect",{x:x-16,y:868,width:32,height:12,rx:4,fill:col},g);
   const f=el("rect",{x:x-30,width:60,rx:8,fill:col},g);return{g,f};};
 S.b1=bar(300,C.gold);S.b2=bar(780,C.grey);
 S.q=el("g",{opacity:0},scene);txt(S.q,540,1120,"?",260,{fill:C.gold,"font-weight":800,"letter-spacing":"0",filter:"url(#glowB)"});
 S.zero=pill(scene,780,1000,"+ 0",C.grey,150,34,70);
 S.growL=K.raysG(300,1100,22);
 // clock -> life
 S.clock=el("g",{opacity:0},scene);el("circle",{r:200,fill:C.card,stroke:C.white,"stroke-width":7},S.clock);
 S.ring=el("circle",{r:200,fill:"none",stroke:C.gold,"stroke-width":10,transform:"rotate(-90)",filter:"url(#glowB)"},S.clock);S.ringL=2*Math.PI*200;S.ring.style.strokeDasharray=S.ringL;
 for(let k=0;k<12;k++){const a=k*Math.PI/6;el("line",{x1:Math.cos(a)*170,y1:Math.sin(a)*170,x2:Math.cos(a)*188,y2:Math.sin(a)*188,stroke:"#fff","stroke-width":5,opacity:.7},S.clock);}
 S.hand=el("line",{x1:0,y1:0,x2:0,y2:-140,stroke:C.white,"stroke-width":8,"stroke-linecap":"round"},S.clock);
 S.cT1=txt(S.clock,0,20,"TIME",64,{"font-weight":800,"letter-spacing":"8"});S.cT2=txt(S.clock,0,20,"LIFE",64,{fill:C.gold,"font-weight":800,"letter-spacing":"8",opacity:0});
 S.cStrike=el("line",{x1:-110,y1:0,x2:110,y2:0,stroke:C.red,"stroke-width":8,"stroke-linecap":"round",opacity:0},S.clock);
 // fork
 S.fork=el("g",{opacity:0},scene);
 S.easy=el("path",{d:`M330,${GY} L1000,${GY}`,fill:"none",stroke:C.grey,"stroke-width":10,"stroke-linecap":"round"},S.fork);
 S.up=el("path",{d:`M330,${GY} L900,880`,fill:"none",stroke:C.gold,"stroke-width":10,"stroke-linecap":"round",filter:"url(#glowB)"},S.fork);
 S.upL=S.up.getTotalLength();S.up.style.strokeDasharray=S.upL;
 S.pE=pill(S.fork,880,GY+60,"EASY",C.grey,150,24,52);S.pM=pill(S.fork,500,1000,"WHAT MATTERS",C.gold,250,24,52);
 S.flag=el("g",{opacity:0},scene);el("line",{x1:900,y1:880,x2:900,y2:740,stroke:C.white,"stroke-width":6,"stroke-linecap":"round"},S.flag);el("path",{d:"M903,742 L975,762 L903,782 Z",fill:C.gold,filter:"url(#glowB)"},S.flag);
 S.halo=el("circle",{cx:900,cy:800,r:200,fill:"url(#halo)",opacity:0},K.bgfx);
 S.crowd=[...Array(6)].map(()=>{const g=el("g",{fill:C.dim,opacity:0},scene);el("circle",{cx:0,cy:-82,r:24},g);el("path",{d:"M-32,-20 Q-32,-48 -12,-48 L12,-48 Q32,-48 32,-20 L32,0 L-32,0 Z"},g);return g;});
 S.hero=makeFig();
},
render(t,K){const {P,eIO,eOut,eExpo,eBack,lerp,clamp,win,C,GY,S}={...K,S:K.S};const sw=(a,b)=>t>=a&&t<b;
 const bp=K.pulses(t,BEATS,8,1,.6);
 // hourglasses at frame 0
 const hO=win(t,-1,T[2]-.1,.01,.3);
 [S.h1,S.h2].forEach(h=>{h.g.setAttribute("opacity",hO.toFixed(3));const sy=(t<T[1]?1:.62);h.g.setAttribute("transform",`translate(${h.x},${t<T[1]?1060:880}) scale(${sy})`);
   const k=clamp((t%4)/4);const th=130*(1-k),bh=130*k;
   h.top.setAttribute("d",`M${-80*(th/130)},${-6-th} L${80*(th/130)},${-6-th} L8,-6 L-8,-6 Z`);h.bot.setAttribute("d",`M-82,140 L82,140 L${82*(1-bh/150)},${140-bh} L${-82*(1-bh/150)},${140-bh} Z`);});
 S.spotL.setAttribute("opacity",(win(t,-1,T[4],.01,.3)*.6+win(t,T[5],T[6],.1,.3)).toFixed(3));S.spotR.setAttribute("opacity",(win(t,-1,T[5],.01,.3)*.5).toFixed(3));
 S.div.setAttribute("opacity",(win(t,T[1],T[6]-.1,.3,.3)*.4).toFixed(3));
 // split figures
 const spl=win(t,T[1]-.05,T[6]-.1,.25,.3);S.laptop.setAttribute("opacity",spl.toFixed(3));S.deskR.setAttribute("opacity",spl.toFixed(3));
 const wipe=Math.sin(t*9);S.cloth.setAttribute("transform",`translate(${830+wipe*70},1278)`);
 S.sparkles.forEach((s,i)=>{const k=((t*1.3+i*.33)%1);s.setAttribute("transform",`translate(${760+i*70},${1260-k*50})`);s.setAttribute("opacity",(spl*Math.sin(k*Math.PI)*(t<T[4]?1:0)).toFixed(3));});
 let L={x:180,y:GY,sit:1,chair:1,work:1,t,droop:.2},R={x:830,y:GY,work:0,raise:.4+.15*wipe,droop:.35,col:C.white};
 const tw=eIO(P(t,T[5],T[5]+.6));
 if(t>=T[4]){R.col=K.mixHex(C.white,C.dim,eIO(P(t,T[4],T[4]+.8)));R.droop=.35+.6*eIO(P(t,T[4]+.3,T[4]+1.2));R.raise=.2;}
 if(t>=T[5]){L={x:240,y:GY-tw*0,col:K.mixHex(C.white,C.gold,tw),sc:1+.25*tw,raise:tw*1.05,raiseL:tw*1.05,droop:-.4*tw};}
 S.fL.draw(L);S.fR.draw(R);S.fL.g.setAttribute("opacity",(spl*(t<T[1]?0:1)).toFixed(3));S.fR.g.setAttribute("opacity",(spl*(t<T[1]?0:1)).toFixed(3));
 // energy bars drain identically
 const eb=win(t,T[2]-.05,T[3]-.05,.25,.3);[S.b1,S.b2].forEach(b=>{b.g.setAttribute("opacity",eb.toFixed(3));const lv=lerp(1,.35,eIO(P(t,T[2],T[3]-.2)));b.f.setAttribute("y",(1090-200*lv).toFixed(1));b.f.setAttribute("height",(200*lv).toFixed(1));});
 // question
 const qq=win(t,T[3]-.02,T[4]-.1,.2,.2);S.q.setAttribute("opacity",qq.toFixed(3));S.q.setAttribute("transform",`translate(540,1000) scale(${(.6+.4*eBack(P(t,T[3],T[3]+.4))).toFixed(3)}) translate(-540,-1000)`);
 K.popAt(S.zero,t,T[4]+.6,T[5]-.1);
 S.growL.setAttribute("opacity",(win(t,T[5],T[6]-.1,.15,.3)*.9).toFixed(3));S.growL.setAttribute("transform",`translate(240,1150) rotate(${t*8})`);
 // clock -> life
 const cl=win(t,T[6]-.05,T[7]-.1,.25,.3);S.clock.setAttribute("opacity",cl.toFixed(3));S.clock.setAttribute("transform","translate(540,1080)");
 S.hand.setAttribute("transform",`rotate(${t*120})`);const fill=eIO(P(t,T[6]+1.5,T[7]-.6));S.ring.style.strokeDashoffset=S.ringL*(1-fill);
 const sw2=eIO(P(t,T[6]+2.2,T[6]+2.6));S.cStrike.setAttribute("opacity",(t>T[6]+1.8?1:0)*(1-sw2));S.cStrike.setAttribute("x2",lerp(-110,110,eIO(P(t,T[6]+1.8,T[6]+2.1))));
 S.cT1.setAttribute("opacity",1-sw2);S.cT2.setAttribute("opacity",sw2);
 // fork
 const fk=win(t,T[7]-.05,38.6,.3,.01);S.fork.setAttribute("opacity",(fk*K.endFade).toFixed(3));
 S.up.style.strokeDashoffset=S.upL*(1-eIO(P(t,T[7]+.2,T[7]+1.2)));
 K.popAt(S.pE,t,T[7]+.9,40);K.popAt(S.pM,t,T[7]+1.2,40);
 S.flag.setAttribute("opacity",(eExpo(P(t,T[7]+1.2,T[7]+1.6))*K.endFade).toFixed(3));S.halo.setAttribute("opacity",((eIO(P(t,T[10],T[10]+.6))*.6+bp*.3)*K.endFade).toFixed(3));
 S.crowd.forEach((g,i)=>{const k=P(t,T[9]+i*.25,T[9]+i*.25+3.2);g.setAttribute("opacity",(k>0&&k<1?Math.min(1,k*6)*(1-P(k,.85,1))*.9:0).toFixed(3));g.setAttribute("transform",`translate(${lerp(330,1050,k)},${GY-Math.abs(Math.sin(t*8+i))*6})`);});
 let H={x:330,y:GY},hop=0;
 if(sw(T[7],T[9])){hop=1;H={x:300,y:GY,look:Math.sin((t-T[8])*2.5)*(t>T[8]?1:0),headTouch:t<T[8]?eIO(P(t,T[7]+.5,T[7]+.9)):0,droop:-.1};}
 if(sw(T[9],T[10])){hop=1;H={x:300,y:GY,look:.6,droop:.1};}
 if(sw(T[10],T[11])){hop=1;H={x:300,y:GY,look:1,droop:-.3,point:eIO(P(t,T[10]+.3,T[10]+.7))};}
 if(t>=T[11]){hop=1;const k=eIO(P(t,T[11],T[12]+.4));const x=lerp(330,880,k);H={x,y:GY-(x-330)*(560/570),ph:t*14,run:k<1?1:0,lean:k<1?.5:0,col:K.mixHex(C.white,C.gold,k)};
   if(k>=1){const v=eBack(P(t,T[12]+.4,T[12]+.8));H={x:880,y:900,col:C.gold,raise:clamp(v)*1.1,raiseL:clamp(v)*1.1,droop:-.4};}}
 S.hero.draw(H);S.hero.g.setAttribute("opacity",(hop*K.endFade).toFixed(3));
 S.rays.setAttribute("opacity",(eIO(P(t,T[11],T[11]+.2))*(.4+.6*clamp(bp))*K.endFade).toFixed(3));S.rays.setAttribute("transform",`translate(880,800) rotate(${t*9})`);
 K.ground.setAttribute("opacity",((1-win(t,T[6]-.05,T[7]-.1,.2,.2)*.9)*(t>=T[7]?0:1))*K.endFade);
 // camera
 const c=K.cam;
 if(t<T[1]){c.sc=1.1-.1*eOut(P(t,0,1.2));c.cy=1080;}
 if(sw(T[3],T[4])){c.sc=1+.1*eIO(P(t,T[3],T[4]));}
 if(sw(T[4],T[5])){c.sc=1+.08*eIO(P(t,T[4],T[5]));c.cx=lerp(540,780,eIO(P(t,T[4],T[5])));}
 if(sw(T[5],T[6])){c.sc=1.08;c.cx=lerp(780,300,eIO(P(t,T[5],T[5]+.5)));}
 if(t>=T[11]){c.sc=1+.1*eIO(P(t,T[11],T[12]+.5));c.cx=lerp(540,760,eIO(P(t,T[11],T[12]+.5)));c.cy=lerp(1150,1000,eIO(P(t,T[11],T[12]+.5)));}
 c.sc+=(t>=T[5]?Math.exp(-(t-T[5])*6)*.12:0)+bp*.05;
 const shk=t>=T[11]?Math.exp(-(t-T[11])*5):0;c.dx=Math.sin(t*90)*16*shk;c.dy=Math.cos(t*77)*10*shk;
 K.flash=(t>=T[5]?Math.exp(-(t-T[5])*9)*.4:0)+K.pulses(t,BEATS,11,.45,.12)+K.pulses(t,[T[1],T[6],T[7]],10,.15,.15);
 K.dim=win(t,T[3],T[4],.1,.3)*.55;
},
};
</script>
